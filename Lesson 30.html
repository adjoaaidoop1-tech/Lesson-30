<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><!-- Paste inside <head> -->
<link rel="stylesheet"
  href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<!-- Paste just before </body> -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
</script>


    <style>
        body {
            background-color: brown;
            font-family: 'Times New Roman', Times, serif;
            padding: 30px 15px;
        }
        h1 {
            text-align: center;
            color: bisque;
        }
        .hobby_card {
            text-align: center;
            border: 2px solid;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: aqua;
        }
        .hobby_card h3 {
            color: coral;
        }

        
        
    

    </style>
</head>
<body>

    <h1>My Hobby Cards</h1>

    <div class="container">

        <div class="row">

            <div class="col_12 col_md_6 col_lg_4">
                <div class="hobby_card">
                    <h3>Drawing</h3>
                    <p>I like sketching movie characters</p>
                </div>
            </div>
             
            <div class="col_12 col_md_6 col_lg_4">
                <div class="hobby_card">
                    <h3>Music</h3>
                    <p>I like listening to different kinds of songs</p>
                </div>
            </div>

            <div class="col_12 col_md_6 col_lg_4">
                <div class="hobby_card">
                    <h3>Reading</h3>
                    <p>I like reading fictional and non fictional books</p>
                </div>

            </div>

        </div>
    </div>

    
    
</body>
</html>
